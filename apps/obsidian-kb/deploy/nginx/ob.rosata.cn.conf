# 【模板示例】静态站点的 Nginx 配置（bootstrap HTTP 版本）。
# 本目录下的站点作为新建站点的模板；部署真实站点时：
#   1. 将 server_name 的域名、/var/www/ 目录名、日志文件名替换为站点自己的；
#   2. 上传至服务器 /etc/nginx/sites-available/<domain>.conf；
#   3. 按注释中的步骤启用并由 Certbot 改写 HTTPS 段。
# 上传至服务器 /etc/nginx/sites-available/ob.rosata.cn.conf 后：
#   ln -s ../sites-available/ob.rosata.cn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d ob.rosata.cn   # Certbot 会自动改写本文件加上 HTTPS 段
# 依赖片段：/etc/nginx/snippets/rosata-security-headers.conf
# （仓库内 apps/rosata-cn/deploy/nginx/rosata-security-headers.conf，全站通用）
server {

    server_name ob.rosata.cn;
    root /var/www/obsidian_kb;
    index index.html;

    access_log /var/log/nginx/ob.rosata.cn.access.log;
    error_log /var/log/nginx/ob.rosata.cn.error.log;

    charset utf-8;
    server_tokens off;

    # gzip 仅在本 server 作用域内调优，不改全局 nginx.conf。
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/ttf
        font/otf;

    include /etc/nginx/snippets/rosata-security-headers.conf;

    location = /favicon.svg {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    # Astro 构建产物与 Pagefind 索引：文件名带内容哈希，一年长缓存。
    location ^~ /_astro/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location ^~ /pagefind/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    # webmanifest 需要专用 MIME 类型。
    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=60";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location ~* \.(?:html|xml|txt|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen 80;
    listen [::]:80;
}
