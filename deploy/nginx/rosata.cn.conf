# rosata.cn 博客的完整 live 配置（与服务器 /etc/nginx/sites-available/rosata.cn.conf 同步）。
# 依赖片段：/etc/nginx/snippets/rosata-security-headers.conf
# （本仓库 deploy/nginx/rosata-security-headers.conf）
#
# 标记 “# managed by Certbot” 的行由 Certbot 管理，重建或续期时不要手动改动。
server {

    server_name rosata.cn www.rosata.cn;
    root /var/www/rosata_blog;
    index index.html;

    access_log /var/log/nginx/rosata.cn.access.log;
    error_log /var/log/nginx/rosata.cn.error.log;

    charset utf-8;
    server_tokens off;

    # gzip 仅在本 server 作用域内开启/调优，不改全局 nginx.conf，避免影响其他站点。
    #（全局 nginx.conf 的 `gzip on;` 对 https 响应已生效，这里补齐类型与细节。）
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        font/ttf
        font/otf;

    include /etc/nginx/snippets/rosata-security-headers.conf;

    location = /favicon.svg {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    # Astro 构建产物与 Pagefind 索引：文件名带内容哈希，一年长缓存。
    location ^~ /_astro/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location ^~ /pagefind/ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|avif|svg|ico|woff2?)$ {
        try_files $uri =404;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    # webmanifest 需要专用 MIME 类型（精确匹配优先于下面的正则 location）。
    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
        add_header Cache-Control "public, max-age=60";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location ~* \.(?:html|xml|txt|json)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=60";
        include /etc/nginx/snippets/rosata-security-headers.conf;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rosata.cn/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rosata.cn/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.rosata.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = rosata.cn) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;

    server_name rosata.cn www.rosata.cn;
    return 404; # managed by Certbot




}
